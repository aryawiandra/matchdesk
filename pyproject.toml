[project]
name = "matchdesk"
version = "0.1.0"
description = "Synthetic football match generator with hidden truth, and evidence-cited match intelligence."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core>=1.22.0",
    "agent-framework-ollama>=1.0.0b261015",
    "fastapi>=0.147.0",
    "pydantic>=2.7",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "scipy>=1.13",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matchdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=matchdesk --cov-report=term-missing --cov-fail-under=80"
