<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MatchDesk</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1>MatchDesk</h1>
    <p class="sub" data-i18n="subtitle">Evidence-cited match insight on a synthetic feed</p>
  </div>
  <form id="controls" aria-label="Replay controls">
    <label><span data-i18n="seed">Match seed</span> <input id="seed" type="number" min="0" max="9999" value="42"></label>
    <label><span data-i18n="speed">Speed</span>
      <select id="speed">
        <option value="60">60x</option>
        <option value="120" selected>120x</option>
        <option value="400">400x</option>
        <option value="0" data-i18n="instant">Instant</option>
      </select>
    </label>
    <label><span data-i18n="explainer">Explainer</span>
      <select id="explainer">
        <option value="template" selected data-i18n="template">Template</option>
        <option value="recorded" disabled>AI model, recorded run (not available here)</option>
        <option value="model" disabled>AI model, live (not available here)</option>
      </select>
    </label>
    <label><span data-i18n="view">View</span>
      <select id="persona">
        <option value="fan" selected data-i18n="fan">Fan</option>
        <option value="analyst" data-i18n="analyst">Analyst</option>
      </select>
    </label>
    <label><span data-i18n="language">Language</span>
      <select id="language">
        <option value="en" selected>English</option>
        <option value="id">Bahasa Indonesia</option>
      </select>
    </label>
    <button type="submit" data-i18n="replay">Replay</button>
  </form>
</header>

<main>
  <section id="scoreboard" aria-label="Scoreboard">
    <span id="home" class="club">Home</span>
    <span id="score" class="score">0 - 0</span>
    <span id="away" class="club">Away</span>
    <span id="clock" class="clock">00:00</span>
  </section>

  <section class="stage">
    <figure class="pitch-wrap">
      <svg id="pitch" viewBox="0 0 105 68" role="img" aria-label="Pitch. The home team attacks to the right.">
        <rect class="grass" x="0" y="0" width="105" height="68"/>
        <g class="lines">
          <rect x="0.5" y="0.5" width="104" height="67"/>
          <line x1="52.5" y1="0.5" x2="52.5" y2="67.5"/>
          <circle cx="52.5" cy="34" r="9.15"/>
          <rect x="0.5" y="13.85" width="16.5" height="40.3"/>
          <rect x="88" y="13.85" width="16.5" height="40.3"/>
          <rect x="0.5" y="24.85" width="5.5" height="18.3"/>
          <rect x="99" y="24.85" width="5.5" height="18.3"/>
        </g>
        <g id="markers"></g>
      </svg>
      <figcaption data-i18n="caption">Home attacks right. A filled marker is the home team, a ring is the away team.</figcaption>
    </figure>
    <div id="cards" aria-label="Insights"></div>
  </section>

  <p id="status" role="status">Ready.</p>
  <div id="live" class="sr-only" aria-live="polite"></div>
</main>

<footer data-i18n="footer">Synthetic data only. Every club, player and number is generated. Click a sentence to see the events behind it.</footer>
<script src="app.js"></script>
</body>
</html>
